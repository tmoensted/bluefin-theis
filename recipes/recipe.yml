---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bluefin-theis
description: Bluefin with netbird, fish, and kitty baked in

base-image: ghcr.io/ublue-os/bluefin
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - jsbillings/netbird
    install:
      packages:
        - micro
        - starship
        - netbird-client
        - netbird-ui
        - fish
        - kitty
  - type: systemd
    system:
      enabled:
        - netbird.service
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user
  - type: signing
